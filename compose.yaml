version: "3.8"

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - finexcel-net
    ports:
      - "${DB_PORT}:5432"

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - finexcel-net

  api-gateway:
    build:
      context: ./backend2/api-gateway
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV}
      - USER_SERVICE_HOST=user-service
      - USER_SERVICE_PORT=8888
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=8889
      - PORT=5555
    volumes:
      - ./backend2/api-gateway/src:/app/src
      - /app/node_modules
    depends_on:
      - auth-service
      - user-service
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5555}:5555"
    networks:
      - finexcel-net

  auth-service:
    build:
      context: ./backend2/auth-service
      dockerfile: Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=${NODE_ENV}
      - PORT=8889
    volumes:
      - ./backend2/auth-service/src:/app/src
      - /app/node_modules
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - finexcel-net

  user-service:
    build:
      context: ./backend2/user-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=${NODE_ENV}
      - PORT=8888
    volumes:
      - ./backend2/user-service/src:/app/src
      - ./backend2/user-service/prisma:/app/prisma
      - /app/node_modules
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - finexcel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    image: finexcel-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:5173"
    networks:
      - finexcel-net

volumes:
  db-data:
  pgadmin-data:

networks:
  finexcel-net: